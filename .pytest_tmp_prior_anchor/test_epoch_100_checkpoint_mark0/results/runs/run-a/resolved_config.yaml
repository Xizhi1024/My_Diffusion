experiment:
  name: prior_anchored_router_100e_run-a
  seed: 42
data:
  mode: png
  cache_dir: cache/tensors_main
  cache_lineage: cache/tensors_main/cache_lineage.json
  dataset_contract: configs/dataset_contract_stage0a_v1.json
  split_manifest: main_data/split_manifest.csv
  require_cache_lineage: true
  use_fake_data: false
  image_size: 192
  batch_size: 4
  val_batch_size: 4
  augment: true
  required_keys:
  - ct
  - pet
  - mask
  optional_keys: []
runtime:
  device: cuda
  require_cuda: true
  amp: true
  channels_last: true
  torch_compile: false
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  gradient_accumulate_every: 2
  grad_clip_norm: 1.0
  log_interval: 10
  eval_interval: 10
  eval_num_samples: 64
  eval_seed: 42
  eval_sampling_steps: 20
  sample_interval: 10
  save_interval: 10
  tracked_sample_ids: []
  gradient_diagnostics: true
  best_checkpoint:
    enabled: true
    combined_alpha: 0.5
    stripe_penalty: 0.3
  early_stopping:
    enabled: false
    patience: 100
    min_epochs: 100
  sample_dir: results/runs/run-a/samples
  training_metrics_jsonl: results/runs/run-a/training_metrics.jsonl
training:
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_min: 1.0e-06
  init_from: null
  resume_from: null
  optimizer_groups:
    enabled: true
    projection_lr: 0.0005
    router_lr: 0.0005
    descriptor_lr: 0.0002
    no_decay_bias_and_offsets: true
  ema:
    decay: 0.995
    update_every: 1
  checkpoint_dir: results/runs/run-a/checkpoints
model:
  objective: pred_x0
  sample_scheduler: ddim
  enable_heteroscedastic: false
  self_conditioning:
    enabled: false
  base_loss:
    mse_weight: 1.0
    l1_weight: 1.0
    gradient_weight: 0.1
    min_snr_enabled: true
    min_snr_gamma: 5.0
modules:
  conditional_mean:
    enabled: true
    levels: 2
    base_channels: 32
    loss_weight: 0.0
    charbonnier_eps: 0.001
    detach_bridge: true
    freeze: true
    checkpoint: checkpoints/mean.pt
  residual_bridge:
    enabled: true
  wavelet_unet:
    enabled: false
  residual_frequency:
    enabled: true
    mode: spectral_evidence_router
    output_channels:
    - 256
    - 256
    - 128
    - 64
    band_scales:
    - 0.5
    - 0.25
    use_noise_release: true
    use_ct_reliability: true
    use_content_reliability: true
    use_subband_gates: true
    use_directional_reliability: false
    use_gabor_gate: false
    ct_reliability_floor_l2: 0.25
    ct_reliability_floor_l1: 0.5
    use_gabor_agreement: false
    gabor_agreement_alpha: 0.1
    gabor_agreement_l2: false
    gabor_agreement_l1: true
    detach_gabor_descriptor: true
    gabor_orientations: 8
    gate_max: 0.25
    snr_center: 0.0
    snr_temperature: 2.0
    cross_temperature: 1.0
    content_hidden_channels: 16
    amplitude_delta_min: -0.05
    amplitude_delta_max: 0.1
    dct_descriptor:
      enabled: true
      pooled_size: 8
      selected_frequencies: 12
    gabor_descriptor:
      enabled: true
    cross_level_router:
      enabled: true
      hidden_channels: 32
      hard_all_null: false
      policy: prior_anchored_learned
      fixed_prior:
      - 0.05
      - 0.05
      - 0.9
      h3_schedule_path: results/runs/run-a/prior/prior.json
      h3_schedule_sha256: b377906b611605c1f381963111604dd02fe4e141951b0ffed67e8b801155a0fc
      h3_schedule_source: direct_png_preview
      h3_repository_root: .
      h3_allow_unverified_preview_lineage: true
      initial_null_probability: 0.9
      active_logit_delta_max: 2.0
      initial_destination_native_probability: 0.95
      prior_warmup_epochs: 10
      prior_active_ramp_epochs: 10
      prior_destination_warmup_epochs: 30
      prior_destination_ramp_epochs: 10
      prior_anchor_decay_end_epoch: 100
      prior_anchor_final_scale: 0.1
      phase_observation_epochs:
      - 10
      - 20
      - 30
      - 40
      - 100
  gabor:
    enabled: true
    scales: 4
    orientations: 8
    kernel_size: 15
    parameter_delta: 0.25
    inject_adapter: false
    use_for_noise: false
    use_for_hotspot: false
    use_for_loss: false
  organ_prior:
    enabled: false
  hotspot_prior:
    enabled: false
  semantic_prior:
    enabled: false
  zero_adapter:
    enabled: false
  condition_dropout:
    enabled: false
  bbdm_bridge:
    name: bbdm_bridge
    num_train_timesteps: 1000
    m_schedule: linear
losses:
  lesion_roi_l1:
    enabled: true
    weight: 1.0
    dilate_radius: 3
    beta: 0.05
    active_tau_max: 0.7
  topk_lesion:
    enabled: true
    weight: 0.15
    topk_percent: 0.1
    active_tau_max: 0.4
  normalized_lesion_peak:
    enabled: true
    weight: 0.1
    topk_percent: 0.1
    min_k: 3
    max_k: 16
    beta: 0.02
    active_tau_max: 0.4
    cold_weight: 1.0
    cold_tolerance: 0.02
  outside_peak_ranking:
    enabled: false
    weight: 0.1
    margin: 0.05
    inside_radius: 3
    outside_radius: 8
    topk_percent: 0.01
    active_tau_max: 0.65
  boundary_frequency:
    enabled: false
    weight: 0.05
    lesion_weight: 1.0
    anatomy_weight: 0.5
    organ_weight: 0.5
    wavelet_weight: 0.25
    boundary_radius: 2
    active_tau_max: 0.7
  frequency_gate_tv:
    enabled: false
    weight: 0.001
  spectral_router_regularization:
    enabled: true
    weight: 1.0
    temporal_weight: 0.0
    dct_weight: 0.0001
    gabor_weight: 0.0001
    active_mass_weight: 0.0
    active_mass_floor: 0.0
    prior_anchor_weight: 0.01
    monotonic_weight: 0.002
    curvature_weight: 0.0002
    budget_weight: 0.002
    shallow_cost_weight: 0.001
    artifact_safety_weight: 0.0
  residual_wavelet:
    enabled: false
    weight: 0.05
    lesion_weight: 4.0
    band_weights:
    - 0.5
    - 1.0
    - 1.5
    active_tau_max: 0.7
  gabor_consistency:
    enabled: false
    weight: 0.02
    lesion_weight: 3.0
    orientation_weight: 0.1
    active_tau_max: 0.7
  focal_frequency:
    enabled: false
  patch_nce:
    enabled: false
  roi_suv:
    enabled: false
  organ_consistency:
    enabled: false
  false_hotspot:
    enabled: false
  hotspot_prior:
    enabled: false
  heteroscedastic_nll:
    enabled: false
  segmenter_consistency:
    enabled: false
metadata:
  enabled: false
segmenter:
  enabled: false
evaluation:
  mc_samples: 1
  physical_suv_available: false
  small_lesion_quantile: 0.25
  small_lesion_underestimate_tolerance: 0.05
  failure_detection:
    outside_margin: 0.05
    lesion_min_ratio: 0.6
    uncertainty_ratio_threshold: 2.0
prior_anchored_run:
  schema_version: 1
  pipeline_id: PRIOR_ANCHORED_ROUTER_100E_CLOUD_V1
  scope: exploratory_direct_png_prior_anchor
  run_dir: results/runs/run-a
  prior_artifact_path: results/runs/run-a/prior/prior.json
  prior_artifact_sha256: b377906b611605c1f381963111604dd02fe4e141951b0ffed67e8b801155a0fc
  mean_checkpoint: checkpoints/mean.pt
  phase_observation_epochs:
  - 10
  - 20
  - 30
  - 40
  - 100
  total_epochs: 100
  path_policy: repository_relative_posix_only
  local_training_performed: false
  cloud_runtime_required: true
