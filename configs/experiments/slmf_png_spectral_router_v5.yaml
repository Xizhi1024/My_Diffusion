# PNG-only spectral-evidence router V5 base. Ablations isolate evidence factors.

experiment:
  name: slmf_png_spectral_router_v5
  seed: 42

data:
  mode: png
  cache_dir: cache/tensors_main
  split_manifest: ../main_data/split_manifest.csv
  image_size: 192
  batch_size: 4
  val_batch_size: 4
  augment: true
  required_keys: [ct, pet, mask]
  optional_keys: []

runtime:
  device: auto
  amp: true
  channels_last: true
  torch_compile: false
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  gradient_accumulate_every: 2
  grad_clip_norm: 1.0
  log_interval: 10
  eval_interval: 10
  eval_num_samples: 64
  eval_seed: 42
  eval_sampling_steps: 20
  sample_interval: 10
  save_interval: 10
  tracked_sample_ids: []
  best_checkpoint:
    enabled: true
    combined_alpha: 0.5
    stripe_penalty: 0.3
  early_stopping:
    enabled: false
    patience: 40
    min_epochs: 50

training:
  num_epochs: 50
  learning_rate: 1e-4
  weight_decay: 0.01
  lr_min: 1e-6
  ema:
    decay: 0.999
    update_every: 10

model:
  objective: pred_x0
  sample_scheduler: ddim
  enable_heteroscedastic: false
  self_conditioning:
    enabled: false
  base_loss:
    mse_weight: 1.0
    l1_weight: 1.0
    gradient_weight: 0.1
    min_snr_enabled: true
    min_snr_gamma: 5.0

modules:
  conditional_mean:
    enabled: true
    levels: 2
    base_channels: 32
    loss_weight: 0.0
    charbonnier_eps: 1e-3
    detach_bridge: true
    freeze: true
    checkpoint: checkpoints/freq_mean_pretrain_v2/mean_best.pt

  residual_bridge:
    enabled: true

  wavelet_unet:
    enabled: false

  residual_frequency:
    enabled: true
    mode: spectral_evidence_router
    output_channels: [256, 256, 128, 64]
    band_scales: [0.5, 0.25]
    use_noise_release: true
    use_ct_reliability: true
    use_content_reliability: true
    use_subband_gates: true
    use_directional_reliability: false
    use_gabor_gate: false
    ct_reliability_floor_l2: 0.25
    ct_reliability_floor_l1: 0.50
    use_gabor_agreement: false
    gabor_agreement_alpha: 0.10
    gabor_agreement_l2: false
    gabor_agreement_l1: true
    detach_gabor_descriptor: true
    gabor_orientations: 8
    gate_max: 0.25
    snr_center: 0.0
    snr_temperature: 2.0
    cross_temperature: 1.0
    content_hidden_channels: 16
    amplitude_delta_min: -0.05
    amplitude_delta_max: 0.10
    dct_descriptor:
      enabled: true
      pooled_size: 8
      selected_frequencies: 12
    gabor_descriptor:
      enabled: true
    cross_level_router:
      enabled: true
      hidden_channels: 32
      hard_all_null: false
      initial_null_probability: 0.90

  gabor:
    enabled: true
    scales: 4
    orientations: 8
    kernel_size: 15
    parameter_delta: 0.25
    inject_adapter: false
    use_for_noise: false
    use_for_hotspot: false
    use_for_loss: false

  organ_prior:
    enabled: false
  hotspot_prior:
    enabled: false
  semantic_prior:
    enabled: false
  zero_adapter:
    enabled: false
  condition_dropout:
    enabled: false
  bbdm_bridge:
    name: bbdm_bridge
    num_train_timesteps: 1000
    m_schedule: linear

losses:
  lesion_roi_l1:
    enabled: true
    weight: 1.0
    dilate_radius: 3
    beta: 0.05
    active_tau_max: 0.7
  topk_lesion:
    enabled: true
    weight: 0.4
    topk_percent: 0.01
    active_tau_max: 0.5
  normalized_lesion_peak:
    enabled: true
    weight: 0.05
    topk_percent: 0.10
    min_k: 3
    max_k: 16
    beta: 0.02
    active_tau_max: 0.25
  outside_peak_ranking:
    enabled: true
    weight: 0.1
    margin: 0.05
    inside_radius: 3
    outside_radius: 8
    topk_percent: 0.01
    active_tau_max: 0.65
  boundary_frequency:
    enabled: false
    weight: 0.05
    lesion_weight: 1.0
    anatomy_weight: 0.5
    organ_weight: 0.5
    wavelet_weight: 0.25
    boundary_radius: 2
    active_tau_max: 0.7
  frequency_gate_tv:
    enabled: true
    weight: 0.001
  spectral_router_regularization:
    enabled: true
    weight: 1.0
    temporal_weight: 1e-4
    dct_weight: 1e-4
    gabor_weight: 1e-4
  residual_wavelet:
    enabled: false
    weight: 0.05
    lesion_weight: 4.0
    band_weights: [0.5, 1.0, 1.5]
    active_tau_max: 0.7
  gabor_consistency:
    enabled: false
    weight: 0.02
    lesion_weight: 3.0
    orientation_weight: 0.1
    active_tau_max: 0.7
  focal_frequency:
    enabled: false
  patch_nce:
    enabled: false
  roi_suv:
    enabled: false
  organ_consistency:
    enabled: false
  false_hotspot:
    enabled: false
  hotspot_prior:
    enabled: false
  heteroscedastic_nll:
    enabled: false
  segmenter_consistency:
    enabled: false

metadata:
  enabled: false
segmenter:
  enabled: false

evaluation:
  mc_samples: 1
  physical_suv_available: false
  failure_detection:
    outside_margin: 0.05
    lesion_min_ratio: 0.6
    uncertainty_ratio_threshold: 2.0
