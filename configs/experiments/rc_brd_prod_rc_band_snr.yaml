# RC-BRD production arm: rc_brd_prod_rc_band_snr (band-SNR clock v2 + Specialist)
#
# DESIGN_RC_BRD_clock_v2: clock_mode=band_snr — the clock queries c~ on
# the band's own bridge SNR lambda_g(m_g) with the frozen per-group power
# P_g (self-consistent fixed point), instead of the shared power-blind
# lambda_0(u) of the v1/base_snr control.  The loss weighting reads the
# SAME single-source axis (schedule.clock_query_log_snr), so clock, head
# gating, A3b density and the per-band Min-SNR-gamma loss cannot drift.
#
# 前置依赖链（fail-closed，缺一不可正式训练）:
#   1. MeanNet 预训练: checkpoints/rc_brd_mean_pretrain/mean_best.pt
#      (src/model/mean_pretraining.py; format_version 1|2, 含 "model")。
#   2. P_g 封存（本臂特有，每折自动）:
#      pixi run rc-brd-band-powers   # = python scripts/compute_band_powers.py
#        --config configs/experiments/rc_brd_prod_rc_band_snr.yaml --fold fold_0
#      产物 artifacts/rc_brd/fold_0/band_powers.json：outer-train 上
#      z0=PET−frozen_mean 的组内 Haar 系数每系数平均功率（§2.3 防止
#      Parseval 1:3:12/16 总量陷阱）。
#   3. R0 probe: scripts/run_recoverability_probe.py（患者级，PASS 才可冻结）。
#   4. freeze（v2 合同，写入 band_powers）:
#      python scripts/freeze_recoverability_contract.py --probe-result ... \
#        --fold fold_0 --out artifacts/rc_brd/fold_0/contract_band_snr.json \
#        --s-ref ... --kappa-grid 0.0,0.5 \
#        --mean-checkpoint checkpoints/rc_brd_mean_pretrain/mean_best.pt \
#        --band-powers-file artifacts/rc_brd/fold_0/band_powers.json
#      独立 out 路径：base_snr 臂（rc_brd_prod_rc.yaml）继续消费无功率
#      合同 artifacts/rc_brd/fold_0/contract.json，重冻结互不干扰。
#
# 匹配设计: 与 rc_brd_prod_rc 除 clock_mode/contract_path/loss 三处外
# 逐键一致（参数/SNR 匹配对照）。clock_mode=band_snr + 无 band_powers 的
# v1 合同会在模型构建期 fail-closed（schedule 守卫）。
#   本臂: kappa=0.5（必须 ∈ 合同 kappa_grid）；loss_weighting=
#   per_band_min_snr 使 A8 逐带 Min-SNR 权重读取真实 SNR_g=exp(lambda_g)
#   （同一单源查询轴）。对照臂：rc_brd_prod_d1（κ=0）、rc_brd_prod_rc
#   （base_snr 时钟）；四臂机制拆解见 rc_brd.ablations.CLOCK_SPECIALIST_ARMS。

experiment:
  name: rc_brd_prod_rc_band_snr
  seed: 42

data:
  mode: png
  cache_dir: cache/tensors_main
  split_manifest: main_data/split_manifest.csv
  image_size: 192
  batch_size: 4
  val_batch_size: 4
  augment: true
  required_keys:
    - ct
    - pet
    - mask
  optional_keys: []

runtime:
  device: auto
  amp: true
  channels_last: true
  torch_compile: false
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  gradient_accumulate_every: 2
  grad_clip_norm: 1.0
  log_interval: 10
  eval_interval: 50
  eval_num_samples: 16
  eval_seed: 42
  eval_sampling_steps: 20
  sample_interval: 50
  save_interval: 50
  rc_brd_fold: fold_0               # 必须与合同 fold_id 一致（fail-closed）
  tracked_sample_ids: []
  best_checkpoint:
    enabled: true
    combined_alpha: 0.5
    stripe_penalty: 0.3
  early_stopping:
    enabled: true
    # Audit P1-1: patience must be >= eval_interval (50).
    patience: 100
    min_epochs: 50

training:
  num_epochs: 300
  learning_rate: 1e-4
  weight_decay: 0.01
  lr_min: 1e-6
  ema:
    # Audit P1-3: 0.995 x 1 washes out init within ~2k steps (matches v5).
    decay: 0.995
    update_every: 1

model:
  objective: pred_x0
  sample_scheduler: ddim
  enable_heteroscedastic: false
  initialization_seed: 1234
  self_conditioning:
    enabled: false
  base_loss:
    mse_weight: 1.0
    l1_weight: 1.0
    gradient_weight: 0.1
    min_snr_enabled: true
    min_snr_gamma: 5.0

modules:
  gabor: {enabled: false}
  organ_prior: {enabled: false}
  hotspot_prior: {enabled: false}
  semantic_prior: {enabled: false}
  zero_adapter: {enabled: false}
  condition_dropout: {enabled: false}

  bbdm_bridge:
    enabled: true
    name: bbdm_bridge
    num_train_timesteps: 1000

  conditional_mean:                 # 与 D1/RC 臂逐键一致（匹配对照）
    enabled: true
    architecture: low_frequency
    checkpoint: checkpoints/rc_brd_mean_pretrain/mean_best.pt
    checkpoint_format: mean
    freeze: true
    detach_bridge: true
    loss_weight: 0.0

  residual_bridge:
    enabled: true
    output_scale: 1.0
    # Audit B5/P1-11: PET is normalized to [-1,1]; the composed mean+
    # residual output must be clamped so PSNR data_range=2 / SSIM range
    # assumptions hold (v5 sets the same).
    clip_output: true

  residual_frequency:
    enabled: false

  rc_brd:
    enabled: true
    forward_mode: bridge_time_changed
    clock_mode: band_snr            # v2 频带时钟（本臂主开关）
    kappa: 0.5                      # ∈ 合同 kappa_grid（freeze 时注册）
    num_timesteps: 1000
    sigma_bridge: 1.0
    lambda_min: -10.0
    lambda_max: 10.0
    endpoint_mode: zeros
    band_groups: 3                  # 必须与合同 band_groups 一致
    contract_path: artifacts/rc_brd/fold_0/contract_band_snr.json   # v2 合同（含 band_powers）
    sampling_mode: endpoint_ddim
    allow_unverified_tokens: false
    # A8 逐带 Min-SNR：权重 = min{SNR_g(t), gamma}，SNR_g=exp(lambda_g)
    # 取自 clock_query_log_snr 单源轴（真实频带 SNR，非 alphahat 代理）。
    loss_weighting: per_band_min_snr
    min_snr_gamma: 5.0
    specialist:
      enabled: true
      a_max: 0.25
      d_max: 0.10
      gate_init: 0.1
      channels: 64
    readout:
      mode: mc_mean
      mc_samples: 8

losses:
  lesion_roi_l1:
    enabled: true
    weight: 1.0
    dilate_radius: 3
    beta: 0.05
    active_tau_max: 0.7
  topk_lesion:
    enabled: true
    weight: 0.4
    topk_percent: 0.01
    active_tau_max: 0.5
  outside_peak_ranking:
    enabled: true
    weight: 0.1
    margin: 0.05
    inside_radius: 3
    outside_radius: 8
    topk_percent: 0.01
    active_tau_max: 0.65
  focal_frequency: {enabled: false}
  patch_nce: {enabled: false}
  roi_suv: {enabled: false}
  organ_consistency: {enabled: false}
  false_hotspot: {enabled: false}
  hotspot_prior: {enabled: false, target_mode: mask_only}
  heteroscedastic_nll: {enabled: false}
  segmenter_consistency: {enabled: false}

metadata:
  enabled: false

segmenter:
  enabled: false

evaluation:
  # 同 D1/RC 臂：故意不写 mc_samples —— evaluate.py 统一入口在 rc_brd
  # readout=mc_mean 时自动把 K 钉到 modules.rc_brd.readout.mc_samples（8）。
  physical_suv_available: false
  failure_detection:
    outside_margin: 0.05
    lesion_min_ratio: 0.6
    uncertainty_ratio_threshold: 2.0