# RC-BRD production arm: rc_brd_prod_rc (RC-clock + Specialist, kappa!=0 under frozen contract)
#
# AUDIT evidence-chain fix (audit round: "建立真实数据生产配置并加载、冻结合格
# MeanNet"). 真实 PNG 数据 + 冻结的条件均值 MeanNet + 合同化 RC-BRD 调度。
#
# 前置依赖链（fail-closed，缺一不可正式训练）:
#   1. MeanNet 预训练: src/model/mean_pretraining.py 产出
#      checkpoints/rc_brd_mean_pretrain/mean_best.pt（format_version 1|2,
#      含 "model" state dict）; freeze=true 在模型构建时强制加载并校验。
#   2. R0 probe: scripts/run_recoverability_probe.py（患者级，PASS 才可冻结）。
#   3. freeze: scripts/freeze_recoverability_contract.py（PASS 门 + b_active
#      仅含通过检验的组）→ artifacts/rc_brd/fold_0/contract.json。
#
# 匹配设计: 本配置与 rc_brd_prod_d1/rc_brd_prod_rc 除 kappa/contract_path 外
# 逐键一致（参数/SNR 匹配对照, 审计"最小矩阵"要求）。
#   clock_mode 说明：两臂均未显式设置 clock_mode（隐式 base_snr，v1 对照 B 时钟）。
#   若需启用 v2 频带时钟：clock_mode: band_snr + 以 --band-powers 冻结的 v2 合同。
#   本臂: kappa=0.5（必须 ∈ 冻结合同 kappa_grid；freeze 时 --kappa-grid 需含
#   0.0 与 0.5）。contract_path 指向 probe PASS 后冻结的合同工件；合同缺失或
#   fold 不匹配时模型构建 fail-closed。κ=0 对照由 rc_brd_prod_d1.yaml 承担。

experiment:
  name: rc_brd_prod_rc
  seed: 42

data:
  mode: png
  cache_dir: cache/tensors_main
  split_manifest: main_data/split_manifest.csv
  image_size: 192
  batch_size: 4
  val_batch_size: 4
  augment: true
  required_keys:
    - ct
    - pet
    - mask
  optional_keys: []

runtime:
  device: auto
  amp: true
  channels_last: true
  torch_compile: false
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  gradient_accumulate_every: 2
  grad_clip_norm: 1.0
  log_interval: 10
  eval_interval: 50
  eval_num_samples: 16
  eval_seed: 42
  eval_sampling_steps: 20
  sample_interval: 50
  save_interval: 50
  rc_brd_fold: fold_0               # 必须与合同 fold_id 一致（fail-closed）
  tracked_sample_ids: []
  best_checkpoint:
    enabled: true
    combined_alpha: 0.5
    stripe_penalty: 0.3
  early_stopping:
    enabled: true
    # Audit P1-1: patience must be >= eval_interval (50); 40 halted the plan at epoch 100.
    patience: 100
    min_epochs: 50

training:
  num_epochs: 300
  learning_rate: 1e-4
  weight_decay: 0.01
  lr_min: 1e-6
  ema:
    # Audit P1-3: 0.999 x every-10 = 10k-step time constant; short runs
    # (100-300 epochs) carried mostly initial weights into EMA-based best
    # selection. 0.995 x 1 washes out init within ~2k steps (matches v5).
    decay: 0.995
    update_every: 1

model:
  objective: pred_x0
  sample_scheduler: ddim
  enable_heteroscedastic: false
  initialization_seed: 1234
  self_conditioning:
    enabled: false
  base_loss:
    mse_weight: 1.0
    l1_weight: 1.0
    gradient_weight: 0.1
    min_snr_enabled: true
    min_snr_gamma: 5.0

modules:
  gabor: {enabled: false}
  organ_prior: {enabled: false}
  hotspot_prior: {enabled: false}
  semantic_prior: {enabled: false}
  zero_adapter: {enabled: false}
  condition_dropout: {enabled: false}

  bbdm_bridge:
    enabled: true
    name: bbdm_bridge
    num_train_timesteps: 1000

  conditional_mean:                 # 与 D1 臂逐键一致（匹配对照）
    enabled: true
    architecture: low_frequency
    checkpoint: checkpoints/rc_brd_mean_pretrain/mean_best.pt
    checkpoint_format: mean
    freeze: true
    detach_bridge: true
    loss_weight: 0.0

  residual_bridge:
    enabled: true
    output_scale: 1.0
    clip_output: false

  residual_frequency:
    enabled: false

  rc_brd:
    enabled: true
    forward_mode: bridge_time_changed
    kappa: 0.5                      # ∈ 合同 kappa_grid（freeze 时注册）
    num_timesteps: 1000
    sigma_bridge: 1.0
    lambda_min: -10.0
    lambda_max: 10.0
    endpoint_mode: zeros
    band_groups: 3                  # 必须与合同 band_groups 一致
    contract_path: artifacts/rc_brd/fold_0/contract.json   # probe PASS 后冻结
    sampling_mode: endpoint_ddim
    allow_unverified_tokens: false
    specialist:
      enabled: true
      a_max: 0.25
      d_max: 0.10
      gate_init: 0.1
      channels: 64
    readout:
      mode: mc_mean
      mc_samples: 8

losses:
  lesion_roi_l1:
    enabled: true
    weight: 1.0
    dilate_radius: 3
    beta: 0.05
    active_tau_max: 0.7
  topk_lesion:
    enabled: true
    weight: 0.4
    topk_percent: 0.01
    active_tau_max: 0.5
  outside_peak_ranking:
    enabled: true
    weight: 0.1
    margin: 0.05
    inside_radius: 3
    outside_radius: 8
    topk_percent: 0.01
    active_tau_max: 0.65
  focal_frequency: {enabled: false}
  patch_nce: {enabled: false}
  roi_suv: {enabled: false}
  organ_consistency: {enabled: false}
  false_hotspot: {enabled: false}
  hotspot_prior: {enabled: false, target_mode: mask_only}
  heteroscedastic_nll: {enabled: false}
  segmenter_consistency: {enabled: false}

metadata:
  enabled: false

segmenter:
  enabled: false

evaluation:
  # 同 D1 臂：mc_samples 由 evaluate.py 统一入口钉到 readout.mc_samples=8。
  physical_suv_available: false
  failure_detection:
    outside_margin: 0.05
    lesion_min_ratio: 0.6
    uncertainty_ratio_threshold: 2.0
