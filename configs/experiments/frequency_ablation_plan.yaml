base_config: configs/experiments/slmf_png_residual_frequency.yaml
ablation_config: configs/experiments/ablations.yaml
output_dir: results/frequency_ablations
reference_id: R0
top_k: 2

variants:
  - id: R0
    preset: freq_r0
  - id: R2
    preset: freq_r2
  - id: F1
    preset: freq_f1
  - id: F2
    preset: freq_f2
  - id: F3
    preset: freq_f3
  - id: F4
    preset: freq_f4

screen:
  experiment_prefix: freq_screen
  epochs: 50
  eval_interval: 10
  split: val
  max_samples: 16
  seed: 42
  mc_steps: 20

promote:
  experiment_prefix: freq_full
  epochs: 300
  eval_interval: 50
  split: val
  max_samples: 64
  seed: 42
  mc_steps: 20
  early_stopping: true

hard_gates:
  failure_any_mean:
    direction: lower
    max_delta: 0.0625
  false_hotspot_density_mean:
    direction: lower
    max_ratio: 1.25
    epsilon: 1e-6
  stripe_excess_mean:
    direction: lower
    max_delta: 0.05
  ssim_mean:
    direction: higher
    max_delta: 0.03
