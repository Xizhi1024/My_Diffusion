# SLMF-BBDM: Ablation presets
# Usage: python scripts/train_v2.py --config configs/experiments/slmf_full.yaml --ablation no_gabor

ablations:
  # ---- Residual-frequency block screen (PNG-only) ----
  freq_r0:
    description: R0 current full-PET CT-to-PET BBDM reference
    overrides:
      modules.conditional_mean.enabled: false
      modules.residual_bridge.enabled: false
      modules.residual_frequency.enabled: false
      modules.gabor.inject_adapter: false
      modules.gabor.use_for_noise: false
      modules.gabor.use_for_hotspot: false
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false

  freq_r2:
    description: R2 conditional low-frequency mean plus zero-endpoint residual BBDM
    overrides:
      modules.conditional_mean.enabled: true
      modules.residual_bridge.enabled: true
      modules.residual_frequency.enabled: false
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false

  freq_f1:
    description: F1 R2 plus level-matched Haar residual skip injection
    overrides:
      modules.conditional_mean.enabled: true
      modules.residual_bridge.enabled: true
      modules.residual_frequency.enabled: true
      modules.residual_frequency.inject_wavelet: true
      modules.residual_frequency.use_gabor_gate: false
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false

  freq_f2:
    description: F2 R2 plus bounded Gabor gate on level-1 residual details only
    overrides:
      modules.conditional_mean.enabled: true
      modules.residual_bridge.enabled: true
      modules.residual_frequency.enabled: true
      modules.residual_frequency.inject_wavelet: false
      modules.residual_frequency.use_gabor_gate: true
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false

  freq_f3:
    description: F3 R2 plus Haar skip injection and bounded complex-Gabor gate
    overrides:
      modules.conditional_mean.enabled: true
      modules.residual_bridge.enabled: true
      modules.residual_frequency.enabled: true
      modules.residual_frequency.inject_wavelet: true
      modules.residual_frequency.use_gabor_gate: true
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false

  freq_f4:
    description: F4 F3 plus lesion-weighted residual-wavelet and target-direction Gabor losses
    overrides:
      modules.conditional_mean.enabled: true
      modules.residual_bridge.enabled: true
      modules.residual_frequency.enabled: true
      modules.residual_frequency.inject_wavelet: true
      modules.residual_frequency.use_gabor_gate: true
      modules.gabor.use_for_loss: true
      losses.residual_wavelet.enabled: true
      losses.gabor_consistency.enabled: true

  # ---- Boundary-reliable V3 screen (complete Wavelet U-Net stays off) ----
  br_r2:
    description: R2 frozen conditional mean plus residual bridge reference
    overrides:
      modules.wavelet_unet.enabled: false
      modules.residual_frequency.enabled: false
      modules.gabor.inject_adapter: false
      modules.gabor.use_for_noise: false
      modules.gabor.use_for_hotspot: false
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false
      losses.boundary_frequency.enabled: false
      losses.frequency_gate_tv.enabled: false

  br_f2:
    description: Legacy F2 direct noisy-state Gabor modulation without skip injection
    overrides:
      modules.wavelet_unet.enabled: false
      modules.residual_frequency.enabled: true
      modules.residual_frequency.mode: legacy
      modules.residual_frequency.inject_wavelet: false
      modules.residual_frequency.state_modulation: true
      modules.residual_frequency.use_gabor_gate: true
      modules.residual_frequency.band_scales: [1.0, 0.5, 0.25]
      modules.gabor.inject_adapter: false
      modules.gabor.use_for_noise: false
      modules.gabor.use_for_hotspot: false
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false
      losses.boundary_frequency.enabled: false
      losses.frequency_gate_tv.enabled: false

  br_f4:
    description: Legacy F4 skip-frequency control with legacy frequency losses
    overrides:
      modules.wavelet_unet.enabled: false
      modules.residual_frequency.enabled: true
      modules.residual_frequency.mode: legacy
      modules.residual_frequency.inject_wavelet: true
      modules.residual_frequency.state_modulation: true
      modules.residual_frequency.use_gabor_gate: true
      modules.residual_frequency.band_scales: [1.0, 0.5, 0.25]
      modules.gabor.inject_adapter: false
      modules.gabor.use_for_noise: false
      modules.gabor.use_for_hotspot: false
      modules.gabor.use_for_loss: true
      losses.residual_wavelet.enabled: true
      losses.gabor_consistency.enabled: true
      losses.boundary_frequency.enabled: false
      losses.frequency_gate_tv.enabled: false

  br_b:
    description: Two-level Haar skip residual with analytic noise release only
    overrides:
      modules.wavelet_unet.enabled: false
      modules.residual_frequency.enabled: true
      modules.residual_frequency.mode: boundary_reliable
      modules.residual_frequency.band_scales: [0.5, 0.25]
      modules.residual_frequency.use_noise_release: true
      modules.residual_frequency.use_ct_reliability: false
      modules.residual_frequency.use_subband_gates: false
      modules.residual_frequency.use_directional_reliability: false
      modules.residual_frequency.use_gabor_gate: false
      modules.gabor.inject_adapter: false
      modules.gabor.use_for_noise: false
      modules.gabor.use_for_hotspot: false
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false
      losses.boundary_frequency.enabled: false
      losses.frequency_gate_tv.enabled: false

  br_c:
    description: BR-B plus CT-PET local edge-energy soft reliability
    overrides:
      modules.wavelet_unet.enabled: false
      modules.residual_frequency.enabled: true
      modules.residual_frequency.mode: boundary_reliable
      modules.residual_frequency.band_scales: [0.5, 0.25]
      modules.residual_frequency.use_noise_release: true
      modules.residual_frequency.use_ct_reliability: true
      modules.residual_frequency.use_subband_gates: false
      modules.residual_frequency.use_directional_reliability: false
      modules.residual_frequency.use_gabor_gate: false
      modules.gabor.inject_adapter: false
      modules.gabor.use_for_noise: false
      modules.gabor.use_for_hotspot: false
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false
      losses.boundary_frequency.enabled: false
      losses.frequency_gate_tv.enabled: false

  br_d:
    description: BR-C plus bounded LH-HL-HH content gates
    overrides:
      modules.wavelet_unet.enabled: false
      modules.residual_frequency.enabled: true
      modules.residual_frequency.mode: boundary_reliable
      modules.residual_frequency.band_scales: [0.5, 0.25]
      modules.residual_frequency.use_noise_release: true
      modules.residual_frequency.use_ct_reliability: true
      modules.residual_frequency.use_subband_gates: true
      modules.residual_frequency.use_directional_reliability: false
      modules.residual_frequency.use_gabor_gate: false
      modules.gabor.inject_adapter: false
      modules.gabor.use_for_noise: false
      modules.gabor.use_for_hotspot: false
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false
      losses.boundary_frequency.enabled: false
      losses.frequency_gate_tv.enabled: false

  br_e:
    description: BR-D plus Gabor quadrature directional reliability
    overrides:
      modules.wavelet_unet.enabled: false
      modules.residual_frequency.enabled: true
      modules.residual_frequency.mode: boundary_reliable
      modules.residual_frequency.band_scales: [0.5, 0.25]
      modules.residual_frequency.use_noise_release: true
      modules.residual_frequency.use_ct_reliability: true
      modules.residual_frequency.use_subband_gates: true
      modules.residual_frequency.use_directional_reliability: true
      modules.residual_frequency.use_gabor_gate: false
      modules.gabor.inject_adapter: false
      modules.gabor.use_for_noise: false
      modules.gabor.use_for_hotspot: false
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false
      losses.boundary_frequency.enabled: false
      losses.frequency_gate_tv.enabled: false

  br_f:
    description: Complete boundary-reliable injector plus boundary and gate-TV losses
    overrides:
      modules.wavelet_unet.enabled: false
      modules.residual_frequency.enabled: true
      modules.residual_frequency.mode: boundary_reliable
      modules.residual_frequency.band_scales: [0.5, 0.25]
      modules.residual_frequency.use_noise_release: true
      modules.residual_frequency.use_ct_reliability: true
      modules.residual_frequency.use_subband_gates: true
      modules.residual_frequency.use_directional_reliability: true
      modules.residual_frequency.use_gabor_gate: false
      modules.gabor.inject_adapter: false
      modules.gabor.use_for_noise: false
      modules.gabor.use_for_hotspot: false
      modules.gabor.use_for_loss: false
      losses.residual_wavelet.enabled: false
      losses.gabor_consistency.enabled: false
      losses.boundary_frequency.enabled: true
      losses.frequency_gate_tv.enabled: true

  # ---- Full baseline (all off) ----
  baseline:
    description: Raw CT concat + standard BBDM + base MSE loss only
    overrides:
      modules.gabor.enabled: false
      modules.organ_prior.enabled: false
      modules.hotspot_prior.enabled: false
      modules.semantic_prior.enabled: false
      modules.zero_adapter.enabled: false
      modules.condition_dropout.enabled: false
      modules.scale_adaptive_noise.enabled: false
      modules.scale_adaptive_noise.name: bbdm_bridge
      losses.topk_lesion.enabled: false
      losses.focal_frequency.enabled: false
      losses.patch_nce.enabled: false
      losses.roi_suv.enabled: false
      losses.false_hotspot.enabled: false
      losses.heteroscedastic_nll.enabled: false
      losses.hotspot_prior.enabled: false
      model.enable_heteroscedastic: false
      model.self_conditioning.enabled: false

  # ---- Single-module ablations ----
  no_gabor:
    description: Remove Gabor bank and all Gabor-dependent weighting
    overrides:
      modules.gabor.enabled: false
      modules.scale_adaptive_noise.use_gabor_energy: false
      losses.focal_frequency.enabled: false

  no_patch_nce:
    description: Remove CT-PET patch contrastive spatial binding
    overrides:
      losses.patch_nce.enabled: false

  no_organ:
    description: Remove organ prior conditioning
    overrides:
      modules.organ_prior.enabled: false

  no_hotspot:
    description: Remove tiny hotspot prior network
    overrides:
      modules.hotspot_prior.enabled: false
      losses.hotspot_prior.enabled: false

  no_zero_adapter:
    description: Use raw CT concat instead of ZeroConv Adapter
    overrides:
      modules.zero_adapter.enabled: false

  isotropic_noise:
    description: Replace scale-adaptive noise with standard isotropic noise
    overrides:
      modules.scale_adaptive_noise.enabled: false
      modules.scale_adaptive_noise.name: bbdm_bridge

  ddpm_not_bbdm:
    description: Standard DDPM instead of Brownian bridge
    overrides:
      modules.scale_adaptive_noise.name: ddpm

  no_time_varying_loss:
    description: Keep all loss terms but make them active across all timesteps
    overrides:
      losses.topk_lesion.active_tau_max: 1.0
      losses.focal_frequency.active_tau_max: 1.0
      losses.roi_suv.active_tau_max: 1.0
      losses.false_hotspot.active_tau_max: 1.0

  no_heteroscedastic:
    description: Remove heteroscedastic uncertainty head
    overrides:
      model.enable_heteroscedastic: false
      losses.heteroscedastic_nll.enabled: false

  no_self_conditioning:
    description: Remove previous-x0 self-conditioning input
    overrides:
      model.self_conditioning.enabled: false

  no_condition_dropout:
    description: Remove condition dropout during training
    overrides:
      modules.condition_dropout.enabled: false

  # ---- Multi-module combinations ----
  loss_only_baseline:
    description: Only loss terms enabled, all prior/conditioning modules off
    overrides:
      modules.gabor.enabled: false
      modules.organ_prior.enabled: false
      modules.hotspot_prior.enabled: false
      modules.semantic_prior.enabled: false
      modules.zero_adapter.enabled: false
      modules.condition_dropout.enabled: false
      modules.scale_adaptive_noise.enabled: false
      modules.scale_adaptive_noise.name: bbdm_bridge

  prior_only_baseline:
    description: Only prior modules enabled, all losses off (except base MSE)
    overrides:
      losses.topk_lesion.enabled: false
      losses.focal_frequency.enabled: false
      losses.patch_nce.enabled: false
      losses.roi_suv.enabled: false
      losses.false_hotspot.enabled: false
      losses.heteroscedastic_nll.enabled: false
      losses.hotspot_prior.enabled: false
      model.enable_heteroscedastic: false
      modules.condition_dropout.enabled: false
