# ---------------------------------------------------------------------------
# Exclusion patterns: a file must be allowlisted AND not match any of these.
# These trees are shared read-only on the cloud machine and must never be
# distributed as code.  ``.git`` is unconditionally protected.
# ---------------------------------------------------------------------------

exclude:
  - "(^|/)\\.git($|/)"
  - "(^|/)\\.worktrees($|/)"
  - "(^|/)main_data($|/)"
  - "(^|/)Data($|/)"
  - "(^|/)data($|/)"
  - "(^|/)cache($|/)"
  - "(^|/)checkpoints($|/)"
  - "(^|/)results($|/)"
  - "(^|/)cloud_runs($|/)"
  - "(^|/)cloud_sync($|/)"
  - "(^|/)logs($|/)"
  - "(^|/)outputs($|/)"
  - "(^|/)samples($|/)"
  - "(^|/)vis_epoch1000($|/)"
  - "(^|/)wandb($|/)"
  - "(^|/)__pycache__($|/)"
  - "(^|/)\\.pytest_cache($|/)"
  - "(^|/)\\.pytest_tmp"
  - "(^|/)node_modules($|/)"
  - "\\.pyc$"
  - "\\.pt$"
  - "\\.pth$"
  - "\\.ckpt$"
  - "\\.npy$"
  - "\\.npz$"
  - "\\.png$"
  - "\\.nii$"
  - "\\.nii\\.gz$"
  - "\\.zip$"
  - "\\.patch$"
  - "\\.bundle$"
  - "(^|/)package(-lock)?\\.json$"
  - "(^|/)playwright\\.config\\.js$"
  - "(^|/)e2e($|/)"
  - "(^|/)\\.github($|/)"
  - "(^|/)artifacts($|/)"
  - "(^|/)My_diffusion($|/)"
  - "(^|/)diffusion 论文($|/)"
  - "(^|/)python$"
