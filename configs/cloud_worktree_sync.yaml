# cloud_worktree_sync.yaml
#
# One-upload, manifest-driven distribution of source files into the router
# mainline and the feature-emergence interpretability branch.  "物理共存、逻辑隔离":
# code is distributed per-group into the two worktrees; data/cache/checkpoints
# are shared read-only and NEVER copied here; outputs and COMPLETE markers are
# owned exclusively by each worktree's own run directories.
#
# Every path below is resolved against the repo root (the directory that
# contains this config).  Change a root → the sync tool refuses to copy across
# the allowed boundary.

roots:
  # Canonical source: the uploaded payload.  On the cloud machine this is where
  # you drop the single upload archive; on the local dev machine it is the main
  # checkout.
  source: "."
  router: ".worktrees/spectral-router-v5"
  feature: ".worktrees/lesion-feature-emergence"
  manifests: "cloud_sync/manifests"
  backups: "cloud_sync/backups"

# ---------------------------------------------------------------------------
# Explicit allowlist groups.
#
# A group entry may be a literal file path or a glob (``*`` = within one path
# segment, ``**`` = across segments, both anchored to the whole relative path).
# Literals that do not exist in the source are ignored, so the same allowlist
# can be shared verbatim by both worktrees.  Everything NOT listed here (and
# not excluded below) is simply never distributed.
#
# classification intent:
#   * src/model/frequency/**  → router mainline only (spectral-router training)
#   * src/mechanism_validation/feature_*.py → feature branch only
#     (interpretability; reads mainline checkpoints but is not part of them)
#   * src/data, src/model (minus frequency), scripts (minus feature_*/run_*),
#     configs/experiments, docs → shared working files
# ---------------------------------------------------------------------------

groups:
  common:
    - "src/__init__.py"
    - "src/data/**"
    - "src/model/__init__.py"
    - "src/model/slmf_bbdm.py"
    - "src/model/config_utils.py"
    - "src/model/trainer.py"
    - "src/model/registry.py"
    - "src/model/ema.py"
