# CT -> PET diffusion training config (Karras U-Net)

# Data paths
train_pet_path: "Data/subset_A/part_PET/ImageSet/PNG"
train_ct_path: "Data/subset_A/part_CT/train_data/ImageSet/PNG"
val_pet_path: "Data/subset_B/part_PET/ImageSet/PNG"
val_ct_path: "Data/subset_B/part_CT/train_data/ImageSet/PNG"

# Training
image_size: 128
batch_size: 8
val_batch_size: 8
num_epochs: 1000
learning_rate: 1e-4
weight_decay: 0.01
lr_min: 1e-6
grad_clip_norm: 1.0
gradient_accumulate_every: 1

# Diffusion objective
objective: "pred_noise"
min_snr_loss_weight: false
min_snr_gamma: 5.0
sample_scheduler: "ddpm"

# Data pipeline
augment: true
normalize: true
use_medical_preprocessing: false
invert_pet: true
invert_pet_on_output: true
data_format: "png"
use_dicom_mapping: false
enable_dicom_hu_suv: false
strict_dicom_suv: false
dicom_pet_folder: null
dicom_ct_folder: null
train_dicom_pet_folder: null
train_dicom_ct_folder: null
val_dicom_pet_folder: null
val_dicom_ct_folder: null
dicom_mapping_mode: "auto_dp"
dicom_slice_order: "z_desc"
dicom_pairing_mode: "z_nearest"
dicom_index_offset: 0
dicom_skip_mismatch: true
dicom_debug_report: false
ct_hu_min: null
ct_hu_max: null
pet_suv_max: 20.0
aux_x0_l1_weight: 0.20
aux_x0_grad_weight: 0.08
aux_x0_pet_focus_weight: 0.25
# Derived from cropped organ image: include the lightest organ region
# shown around grayscale 250/255 in output domain.
# Training uses invert_pet=true, so threshold is mapped as 1 - 250/255 ~= 0.02.
aux_x0_pet_threshold: 0.02
aux_x0_pet_high_weight: 18.0
aux_x0_bg_suppress_weight: 0.06
tumor_region_weight: 18.0
tumor_weight_min: 10.0
tumor_weight_max: 50.0
enforce_tumor_weight_range: true
use_structure_weighted_noise: true
use_structure_weighted_x0_l1: true
structure_focus_threshold: 0.02
structure_focus_weight: 18.0
structure_background_weight: 0.15
structure_weight_warmup_epochs: 10
background_target_value: 0.0
enable_quantitative_constraints: false
quantitative_constraint_weight: 0.0
quant_hotspot_threshold: 0.02
quant_topk_percent: 0.01
quant_mean_weight: 1.0
quant_integral_weight: 1.0
quant_hotspot_weight: 1.0
quant_peak_weight: 1.0
enable_heteroscedastic: false
heteroscedastic_logvar_min: -6.0
heteroscedastic_logvar_max: 2.0
use_heteroscedastic_nll: false
heteroscedastic_nll_weight: 1.0
heteroscedastic_mse_weight: 0.1

# Runtime
num_workers: 4
seed: 42
save_interval: 100
eval_interval: 25
num_inference_steps_eval: 1000
num_inference_steps_sample: 1000
num_mc_samples_eval: 1

# EMA
use_ema: true
ema_decay: 0.995
ema_update_every: 10
ema_update_after_step: 0
ema_use_warmup: false

# AMP
use_amp: true

# Logging
use_wandb: false
project_name: "pet-ct-diffusion-karras"

# Experimental modules (disabled in default train/test scripts)
experimental:
  enable_controlnet: false
  enable_continuous_time: false

# Model
# one-click profile switch:
# - standard_diffusion1: baseline diffusion1 (raw CT concat)
# - dual_stream_attention: dual-stream local/global attention encoder
pipeline_profile: "dual_stream_attention"
model_variant: "dual_stream_attention"
unet_type: "karras"
karras_unet_config:
  dim: 128
  dim_max: 768
  num_downsamples: 4
  num_blocks_per_stage: 2
  attn_res: [16, 8]
  fourier_dim: 16
  attn_dim_head: 64
  attn_flash: true
  mp_cat_t: 0.5
  mp_add_emb_t: 0.5
  attn_res_mp_add_t: 0.3
  resnet_mp_add_t: 0.3
  dropout: 0.1

# Backward-compatible keys
latent_channels: 4
unet_config: null

# Used when pipeline_profile/model_variant = dual_stream_attention
dual_stream_config:
  base_channels: 32
  out_channels: 32
  num_heads: 2
  groups: 8
  local_window_size: 8
  global_pool_size: 8
