# CT -> PET diffusion training config (Karras U-Net)

# Data paths
train_pet_path: "Data/subset_A/part_PET/ImageSet/PNG"
train_ct_path: "Data/subset_A/part_CT/train_data/ImageSet/PNG"
val_pet_path: "Data/subset_B/part_PET/ImageSet/PNG"
val_ct_path: "Data/subset_B/part_CT/train_data/ImageSet/PNG"

# Training
image_size: 128
batch_size: 8
val_batch_size: 8
num_epochs: 100
learning_rate: 1e-4
weight_decay: 0.01
lr_min: 1e-6
grad_clip_norm: 1.0
gradient_accumulate_every: 1

# Diffusion objective
objective: "pred_noise"
min_snr_loss_weight: true
min_snr_gamma: 5.0

# Data pipeline
augment: true
normalize: true
use_medical_preprocessing: false

# Runtime
num_workers: 4
seed: 42
save_interval: 10
eval_interval: 10
num_inference_steps_eval: 1000
num_inference_steps_sample: 1000

# EMA
use_ema: true
ema_decay: 0.995
ema_update_every: 10
ema_update_after_step: 0
ema_use_warmup: false

# AMP
use_amp: true

# Logging
use_wandb: false
project_name: "pet-ct-diffusion-karras"

# Model
unet_type: "karras"
karras_unet_config:
  dim: 128
  dim_max: 768
  num_downsamples: 4
  num_blocks_per_stage: 2
  attn_res: [16, 8]
  fourier_dim: 16
  attn_dim_head: 64
  attn_flash: true
  mp_cat_t: 0.5
  mp_add_emb_t: 0.5
  attn_res_mp_add_t: 0.3
  resnet_mp_add_t: 0.3
  dropout: 0.1

# Backward-compatible keys
latent_channels: 4
unet_config: null
