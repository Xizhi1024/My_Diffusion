# CT -> PET high-precision config (PNG pairs + DICOM HU/SUV quantitative pipeline)

# Data paths (PNG pairing source)
train_pet_path: "Data/subset_A/part_PET/ImageSet/PNG"
train_ct_path: "Data/subset_A/part_CT/train_data/ImageSet/PNG"
val_pet_path: "Data/subset_B/part_PET/ImageSet/PNG"
val_ct_path: "Data/subset_B/part_CT/train_data/ImageSet/PNG"

# Training
image_size: 128
batch_size: 4
val_batch_size: 4
num_epochs: 1000
learning_rate: 1e-4
weight_decay: 0.01
lr_min: 1e-6
grad_clip_norm: 1.0
gradient_accumulate_every: 2

# Diffusion objective
objective: "pred_noise"
min_snr_loss_weight: true
min_snr_gamma: 5.0
sample_scheduler: "ddpm"

# Data pipeline (PNG -> optional DICOM quantitative restoration)
augment: true
normalize: true
use_medical_preprocessing: false
invert_pet: true
invert_pet_on_output: true

data_format: "png"
use_dicom_mapping: true
enable_dicom_hu_suv: true
strict_dicom_suv: false

# DICOM roots
train_dicom_pet_folder: "Data/subset_A/part_PET/ImageSet/DICOM"
train_dicom_ct_folder: "Data/subset_A/part_CT/train_data/ImageSet/DICOM"
val_dicom_pet_folder: "Data/subset_A/part_PET/ImageSet/DICOM"
val_dicom_ct_folder: "Data/subset_A/part_CT/train_data/ImageSet/DICOM"

dicom_mapping_mode: "auto_dp"
dicom_slice_order: "z_desc"
dicom_pairing_mode: "z_nearest"
dicom_index_offset: 0
dicom_skip_mismatch: true
dicom_debug_report: false

# CT/PET quantitative normalization
ct_hu_min: -150.0
ct_hu_max: 250.0
pet_suv_max: 20.0
pet_max_suv: null

# Base auxiliary losses
aux_x0_l1_weight: 0.20
aux_x0_grad_weight: 0.08
aux_x0_pet_focus_weight: 0.20
aux_x0_pet_threshold: 0.08
aux_x0_pet_high_weight: 18.0
aux_x0_bg_suppress_weight: 0.04
tumor_region_weight: 18.0
tumor_weight_min: 10.0
tumor_weight_max: 50.0
enforce_tumor_weight_range: true

# Structure-aware weighting
use_structure_weighted_noise: true
use_structure_weighted_x0_l1: true
structure_focus_threshold: 0.08
structure_focus_weight: 18.0
structure_background_weight: 0.15
structure_weight_warmup_epochs: 20
background_target_value: 0.0

# Quantitative constraints (normalized [0,1] domain)
enable_quantitative_constraints: true
quantitative_constraint_weight: 0.20
quant_hotspot_threshold: 0.08
quant_topk_percent: 0.01
quant_mean_weight: 1.0
quant_integral_weight: 1.0
quant_hotspot_weight: 1.2
quant_peak_weight: 1.2

# Uncertainty / heteroscedastic NLL
enable_heteroscedastic: true
heteroscedastic_logvar_min: -6.0
heteroscedastic_logvar_max: 2.0
use_heteroscedastic_nll: true
heteroscedastic_nll_weight: 1.0
heteroscedastic_mse_weight: 0.05

# Runtime
num_workers: 2
seed: 42
save_interval: 50
eval_interval: 25
num_inference_steps_eval: 1000
num_inference_steps_sample: 1000
num_mc_samples_eval: 4

# EMA
use_ema: true
ema_decay: 0.995
ema_update_every: 10
ema_update_after_step: 0
ema_use_warmup: false

# AMP
use_amp: true

# Logging
use_wandb: false
project_name: "pet-ct-diffusion-high-precision"

# Experimental modules (disabled in default train/test scripts)
experimental:
  enable_controlnet: false
  enable_continuous_time: false

# Model
pipeline_profile: "standard_diffusion1"
model_variant: "standard_diffusion1"
unet_type: "diffusers"
unet_config:
  in_channels: 2
  out_channels: 1
  sample_size: 128
  layers_per_block: 2
  block_out_channels: [64, 128, 256, 256, 512]
  down_block_types:
    - "DownBlock2D"
    - "DownBlock2D"
    - "DownBlock2D"
    - "AttnDownBlock2D"
    - "DownBlock2D"
  up_block_types:
    - "UpBlock2D"
    - "AttnUpBlock2D"
    - "UpBlock2D"
    - "UpBlock2D"
    - "UpBlock2D"

# Backward-compatible key
latent_channels: 4
