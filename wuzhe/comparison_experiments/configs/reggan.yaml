experiment:
  name: cmp_reggan
  seed: 42

data:
  cache_dir: cache/tensors
  split_manifest: cache/split_manifest.csv
  image_size: 192
  batch_size: 2
  val_batch_size: 2
  augment: true
  required_keys: [ct, pet, mask]

runtime:
  amp: true
  channels_last: true
  torch_compile: false
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  gradient_accumulate_every: 2
  grad_clip_norm: 1.0
  eval_interval: 50
  sample_interval: 50
  save_interval: 50
  eval_sampling_steps: 20

training:
  num_epochs: 1000
  learning_rate: 0.0002
  weight_decay: 0.0
  lr_min: 0.000001
  ema:
    decay: 0.999
    update_every: 10

comparison_model:
  name: reggan
  base_channels: 64
  num_res_blocks: 6
  lambda_registration: 10.0
  lambda_smooth: 0.1

