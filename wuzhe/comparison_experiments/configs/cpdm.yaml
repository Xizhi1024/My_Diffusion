experiment:
  name: cmp_cpdm
  seed: 42

data:
  cache_dir: cache/tensors
  split_manifest: cache/split_manifest.csv
  image_size: 192
  batch_size: 4
  val_batch_size: 4
  augment: true
  required_keys: [ct, pet, mask]
  optional_keys: [mu_map, ct_hu]

runtime:
  amp: true
  channels_last: true
  torch_compile: false
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  gradient_accumulate_every: 2
  grad_clip_norm: 1.0
  eval_interval: 50
  sample_interval: 50
  save_interval: 50
  eval_sampling_steps: 20

training:
  num_epochs: 1000
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_min: 0.000001
  ema:
    decay: 0.999
    update_every: 10

comparison_model:
  name: cpdm
  base_channels: 64
  first_stage_channels: 32
  latent_channels: 3
  vq_num_embeddings: 512
  use_vq: true
  num_train_timesteps: 1000
  lambda_attention: 1.0
  lambda_vq: 1.0
  lambda_first_stage: 1.0
  lambda_latent: 1.0
  mse_weight: 1.0
  l1_weight: 1.0
  gradient_weight: 0.1
