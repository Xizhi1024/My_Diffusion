# SLMF-BBDM: direct PNG data, CT/PET/label -> 256x256 model tensors

experiment:
  name: slmf_bbdm_png256
  seed: 42

data:
  # Expected Windows layout, matching the local machine:
  #   C:\研究生课题（子宫内膜癌）\工作3\
  #     data\{train,val}\{images,pet,labels}
  #     My_diffusion\
  # From My_diffusion, ../data resolves to the sibling data directory.
  # Override with: --override data.png_root="C:\absolute\path\to\data"
  png_root: ../data
  png_ct_dir: images
  png_pet_dir: pet
  png_label_dir: labels
  png_require_label: true
  train_split_name: train
  val_split_name: val
  cache_dir: ""
  split_manifest: null
  image_size: 256
  batch_size: 4
  val_batch_size: 4
  augment: true
  required_keys:
    - ct
    - pet
    - mask
  optional_keys:
    - organ_mask
    - organ_distance
    - mu_map
    - ct_hu
    - pet_activity
    - meta

runtime:
  device: auto
  amp: true
  channels_last: true
  torch_compile: false
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  gradient_accumulate_every: 2
  grad_clip_norm: 1.0
  eval_interval: 50
  eval_num_samples: 16
  eval_sampling_steps: 20
  sample_interval: 50
  save_interval: 50
  mc_samples_eval: 20

training:
  num_epochs: 1000
  learning_rate: 1e-4
  weight_decay: 0.01
  lr_min: 1e-6
  ema:
    decay: 0.999
    update_every: 10

model:
  unet_type: diffusers
  objective: pred_x0
  sample_scheduler: ddim
  enable_heteroscedastic: true
  heteroscedastic_logvar_min: -6.0
  heteroscedastic_logvar_max: 2.0
  self_conditioning:
    enabled: true
    probability: 0.5
  base_loss:
    mse_weight: 1.0
    l1_weight: 1.0
    gradient_weight: 0.1
    min_snr_enabled: true
    min_snr_gamma: 5.0

modules:
  gabor:
    enabled: true
    filters: 32
    inject_adapter: true
    use_for_noise: true
    use_for_loss: true

  organ_prior:
    enabled: false

  hotspot_prior:
    enabled: true
    base_channels: 16
    params_max: 500000

  semantic_prior:
    enabled: false

  zero_adapter:
    enabled: true

  condition_dropout:
    enabled: true
    p_organ: 0.0
    p_hotspot: 0.1
    p_semantic: 0.0
    p_meta: 0.0
    p_gabor: 0.1

  scale_adaptive_noise:
    enabled: true
    name: scale_adaptive
    num_train_timesteps: 1000
    low_sigma_mult: 1.0
    mid_sigma_mult: 0.75
    high_sigma_mult: 0.45
    use_gabor_energy: true
    bridge_mode: true

losses:
  topk_lesion:
    enabled: true
    weight: 0.2
    topk_percent: 0.01
    active_tau_max: 0.25

  focal_frequency:
    enabled: true
    weight: 0.1
    alpha: 1.0
    active_tau_max: 0.4

  patch_nce:
    enabled: true
    weight: 0.1
    patch_size: 3
    num_patches: 256
    temperature: 0.07
    active_tau_max: 0.6

  roi_suv:
    enabled: false

  false_hotspot:
    enabled: false

  organ_consistency:
    enabled: false

  hotspot_prior:
    enabled: true
    weight: 0.1
    active_tau_min: 0.25
    active_tau_max: 0.75
    distance_weight: 0.0

  segmenter_consistency:
    enabled: false

  heteroscedastic_nll:
    enabled: true
    weight: 1.0

metadata:
  enabled: false

segmenter:
  enabled: false
  checkpoint: null
