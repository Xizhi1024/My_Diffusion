[workspace]
name = "pet-ct-diffusion"
channels = [
    "https://prefix.dev/conda-forge",      # 最高优先级
    "pytorch",          # 第二优先级
    "nvidia",           # 第三优先级
    "bioconda",         # 最低优先级
    ]
platforms = ["linux-64"]

[tasks]
train = "python scripts/train_v2.py --config configs/experiments/slmf_full.yaml"
test = "python -m pytest -q tests"
evaluate = "python -m pytest -q tests/test_smoke.py -k sample"
unit-test = "python -m pytest -q tests"
smoke-test = "python -m pytest -q tests/test_smoke.py"
eval-full = "python scripts/evaluate.py --config configs/experiments/slmf_full.yaml --split test"
preprocess = "python -m src.data.dataset --manifest cache/manifest.csv --out-dir cache/tensors"
organ-prior = "python -m src.data.organ_preprocess --cache-dir cache/tensors --gpu"
semantic-tokens = "python -m src.data.semantic_builder --cache-dir cache/tensors --backend radimagenet --gpu"
split-manifest = "python -m src.data.split_manifest --cache-dir cache/tensors --output cache/split_manifest.csv"

[dependencies]
# 核心依赖，特别是需要从特定渠道（如pytorch, nvidia）获取的
python = ">=3.11,<3.14"  # PyTorch 2.0+ 需要 Python 3.8 或更高版本
scikit-image = ">=0.25.2,<0.26"

[pypi-dependencies]
# 其他可以通过 PyPI 安装的依赖
torch = { version = ">=2.8.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
accelerate = "*"
einops = "*"
ema-pytorch = ">=0.4.2"
numpy = "*"
pillow = "*"
pytorch-fid = "*"
scipy = "*"
tqdm = "*"
# 新增的医学图像处理和感知损失相关依赖
nibabel = "*"  # NIfTI格式支持
lpips = "*"    # 感知损失
timm = "*"     # 预训练模型
transformers = "*"  # Transformer组件
diffusers = "*"     # Diffusion模型库
opencv-python = "*"
matplotlib = "*"
tensorboard = "*"
wandb = "*"
pytest = "*"
pydicom = ">=3.0.2, <4"
