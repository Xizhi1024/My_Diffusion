[project]
name = "pet-ct-diffusion"
version = "0.1.0"
description = "PET to CT translation using dual-stream diffusion model inspired by MSRD-Net"
authors = ["xizhi <2960944913@qq.com>"]
channels = [
    "https://prefix.dev/conda-forge",      # 最高优先级
    "pytorch",          # 第二优先级
    "nvidia",           # 第三优先级
    "bioconda",         # 最低优先级
    ]
platforms = ["linux-64"]

[tasks]
train = "python scripts/train_v2.py --config configs/config_karras.yaml"
test = "python scripts/test.py"
evaluate = "python scripts/test.py --eval --notebook 1 --checkpoint checkpoints/checkpoint_epoch_600.pth"

[dependencies]
# 核心依赖，特别是需要从特定渠道（如pytorch, nvidia）获取的
python = ">=3.11,<3.14"  # PyTorch 2.0+ 需要 Python 3.8 或更高版本
scikit-image = ">=0.25.2,<0.26"

[pypi-dependencies]
# 其他可以通过 PyPI 安装的依赖
torch = { version = ">=2.8.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
accelerate = "*"
einops = "*"
ema-pytorch = ">=0.4.2"
numpy = "*"
pillow = "*"
pytorch-fid = "*"
scipy = "*"
tqdm = "*"
# 新增的医学图像处理和感知损失相关依赖
nibabel = "*"  # NIfTI格式支持
lpips = "*"    # 感知损失
timm = "*"     # 预训练模型
transformers = "*"  # Transformer组件
diffusers = "*"     # Diffusion模型库
opencv-python = "*"
matplotlib = "*"
tensorboard = "*"
wandb = "*"